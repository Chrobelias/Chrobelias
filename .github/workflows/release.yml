name: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os:
          - "alpine:latest"
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.os }}
    # The checkout is owned by the runner's uid while the container runs as
    # root, so git refuses to touch it. opam runs git with GIT_CONFIG_GLOBAL
    # and GIT_CONFIG_SYSTEM pointed at /dev/null, so "git config --global /
    # --system" never reaches it; the GIT_CONFIG_COUNT variables are kept.
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    steps:
      - run: apk add alpine-sdk

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install extra dependencies
        if: startsWith(matrix.os, 'alpine')
        run: apk add bash sqlite sqlite-dev gmp gmp-dev gmp-static cmake python3 bubblewrap gnupg wget

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.3.0+options,ocaml-option-flambda,ocaml-option-static
          opam-pin: false

      - run: opam --version
      - run: opam exec -- ocamlopt --version
      - run: opam switch list

      - name: Build and install static Z3
        run: |
          git clone --depth 1 --branch z3-5.1.0 https://github.com/Z3Prover/z3.git z3
          cp ./scripts/z3-static.opam z3/opam
          eval $(opam env)
          (cd z3 &&
           opam install .)

      - name: Install depedencies
        run: opam install . --deps-only --with-test -vvv

      - name: List opam packages
        run: opam list

      - name: Build
        run: opam exec -- dune build --release bin/chro.exe

      - run: mv _build/default/bin/chro.exe _build/default/bin/chro

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chro
          path: _build/default/bin/chro

  smoke-test:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: examples

      - uses: actions/download-artifact@v4
        with:
          name: Chro
          path: bin

      - run: chmod +x bin/chro

      - name: Check the binary is static
        run: |
          file bin/chro
          if ldd bin/chro; then
            echo "Error: chro is dynamically linked"
            exit 1
          fi

      - name: Solve a sat example
        run: |
          bin/chro examples/lnr-sat.smt2 | tee out.txt
          [ "$(head -n1 out.txt | cut -d' ' -f1)" = sat ]

      - name: Solve an unsat example
        run: |
          bin/chro examples/lnr-unsat.smt2 | tee out.txt
          [ "$(head -n1 out.txt | cut -d' ' -f1)" = unsat ]

  draft-release:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Chro
          path: bin

      - name: Draft release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            bin/chro
          token: "${{ secrets.GITHUB_TOKEN }}"
