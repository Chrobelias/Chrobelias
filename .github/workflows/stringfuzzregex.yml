name: Run stringfuzzregex

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

env:
  OPAMROOT: /home/user/.opam
  SUITE: ./benchmarks/chrobelias/QF_SLIA/stringfuzzregex-old/*.smt2

jobs:
  stringfuzzregex:
    runs-on: ubuntu-latest
    container:
      image: we1ine/chrobelias:latest
      options: --user root --init
    strategy:
      fail-fast: false
      matrix:
        flags: ["-q", "-q -lsb"]
    steps:
      - run: opam --version
      - run: opam exec -- ocamlopt --version

      - uses: actions/checkout@v6
        with:
          submodules: true

      #- uses: ocaml/setup-ocaml@v3
      #  with:
      #    ocaml-compiler: 5.3
      #    dune-cache: true

      #- name: Install Smtml depedencies
      #  working-directory: ./vendor/smtml
      #  run: opam install . --deps-only --with-test --with-dev-setup

      #- name: Install depedencies
      #  run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      - name: Run stringfuzzregex and measure time
        run: |
          set +e;
          # Fail instead of silently running nothing if the suite moves again.
          set -- $SUITE
          [ -e "$1" ] || { echo "No benchmarks match $SUITE"; exit 1; }
          START_TIME=$(date +%s)
          for i in "$@"; do
            echo $i;
            timeout 10s _build/default/bin/chro.exe ${{ matrix.flags }} $i --check-model;
            [ $? -eq 124 ] && echo "timeout (10s)";
          done 2>&1 | tee res.txt;
          END_TIME=$(date +%s)
          DURATION=$(($END_TIME - $START_TIME))
          echo "Benchmarks completed in: $DURATION seconds with ${{ matrix.flags }}"

      - name: Get stats
        run: |
          echo "StringFuzzRegex with ${{ matrix.flags }} flags";
          echo "sat     : $(grep -c '^sat' res.txt)";
          echo "unsat   : $(grep -c '^unsat' res.txt)";
          echo "unknown : $(grep -c '^unknown' res.txt)";
          echo "timeouts: $(grep -c '^timeout' res.txt)";
          echo "errors  : $(grep -c error res.txt)";
          echo "warnings: $(grep -c warn res.txt)";
          echo "total   : $(grep -c '\.smt2$' res.txt)";
