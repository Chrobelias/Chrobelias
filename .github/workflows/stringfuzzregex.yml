name: Run stringfuzzregex

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

env:
  OPAMROOT: /home/user/.opam
  SUITE: ./benchmarks/chrobelias/QF_SLIA/stringfuzz/transformed/z3str2/*.smt2

jobs:
  stringfuzzregex:
    runs-on: ubuntu-latest
    container:
      image: we1ine/chrobelias:latest
      options: --user root --init
    strategy:
      fail-fast: false
      matrix:
        flags: ["-q", "-q -lsb"]
    steps:
      - run: opam --version
      - run: opam exec -- ocamlopt --version

      - uses: actions/checkout@v6
        with:
          submodules: true

      #- uses: ocaml/setup-ocaml@v3
      #  with:
      #    ocaml-compiler: 5.3
      #    dune-cache: true

      #- name: Install Smtml depedencies
      #  working-directory: ./vendor/smtml
      #  run: opam install . --deps-only --with-test --with-dev-setup

      #- name: Install depedencies
      #  run: opam install . --deps-only --with-test

      - name: Check out the base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # dune skips directories starting with _, so the main build
          # doesn't see this one.
          path: _base

      - name: Build
        run: |
          opam exec -- dune build
          cp _build/default/bin/chro.exe /tmp/pr.exe

      - name: Build the base branch
        if: github.event_name == 'pull_request'
        run: |
          opam exec -- dune build --root _base bin/chro.exe
          cp _base/_build/default/bin/chro.exe /tmp/base.exe

      - name: Run stringfuzzregex
        run: |
          # Fail instead of silently running nothing if the suite moves again.
          set -- $SUITE
          [ -e "$1" ] || { echo "No benchmarks match $SUITE"; exit 1; }
          label=$(echo "${{ matrix.flags }}" | tr -cs 'a-z0-9' '-' | sed 's/^-//; s/-$//')
          echo "LABEL=$label" >> "$GITHUB_ENV"
          bins="--bin PR=/tmp/pr.exe"
          [ -x /tmp/base.exe ] && bins="--bin base=/tmp/base.exe $bins"
          python3 .github/workflows/sfr-check.py --flags="${{ matrix.flags }}" \
            --label "$label" --out sfr $bins "$@"
          cat sfr/summary-*.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sfr-${{ env.LABEL }}
          path: sfr/

  # One comment per PR, for the default mode (-q) only. It is posted when the
  # PR solves fewer benchmarks than its base, and edited on later pushes, also
  # when the regression is gone.
  report:
    needs: stringfuzzregex
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sfr-*
          merge-multiple: true
          path: sfr

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- chrobelias-stringfuzzregex-regression -->';
            if (!fs.existsSync('sfr')) return core.warning('No stringfuzzregex results');
            // Only the default mode (-q) goes into the comment; the other
            // matrix entries are in their job summaries.
            const label = 'q';
            const read = (f) => fs.readFileSync(`sfr/${f}`, 'utf8');
            if (!fs.existsSync(`sfr/result-${label}.json`)) return core.warning(`No results for -${label}`);
            const results = [JSON.parse(read(`result-${label}.json`))];
            const summaries = [read(`comment-${label}.md`)];
            const regressed = results.some((r) => r.regressed);
            const sha = context.payload.pull_request.head.sha.slice(0, 9);
            const title = regressed
              ? `## Regression in stringfuzzregex\n\nAs of ${sha}, this PR solves fewer stringfuzzregex benchmarks than its base, or gives answers the base didn't get wrong.`
              : `## No regression in stringfuzzregex\n\nAs of ${sha}, this PR solves at least as many stringfuzzregex benchmarks as its base.`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [marker, title, ...summaries, `The files are listed in the [CI run](${run}).`].join('\n\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const old = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else if (regressed) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
