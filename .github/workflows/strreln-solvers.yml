name: Perf different solvers on StrREln

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

env:
  TIMEOUT: 30s

jobs:
  strreln-solvers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3
          dune-cache: true

      - name: Install Smtml depedencies
        working-directory: ./vendor/smtml
        run: opam install . --deps-only --with-test --with-dev-setup

      - name: Install depedencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build @all

      - name: Run Chrobelias on StrReLN benchmarks with 1 variable
        run: |
          set +e +o pipefail;
          START_TIME=$(date +%s)
          for i in "./benchmarks/chrobelias/QF_SLIA/2025-generated-strreln/str-reln/benchmark_v1_"*.smt2; do
            echo $i;
            timeout $TIMEOUT time opam exec -- dune exec Chro --no-build -- $i;
            if [[ $exit_status -eq 124 ]]; then
              echo "timeout";
            fi;
          done 2>&1 | tee res_chro.txt;
          END_TIME=$(date +%s)
          DURATION=$(($END_TIME - $START_TIME))
          echo "Benchmarks with 1 variable completed by Chrobelias in: $DURATION seconds with ${{ matrix.flags }}"

      - name: Run CVC5 on StrReLN benchmarks with 1 variable
        run: |
          set +e +o pipefail;
          START_TIME=$(date +%s)
          for i in "./benchmarks/chrobelias/QF_SLIA/2025-generated-strreln/str-reln/benchmark_v1_"*.smt2; do
            echo $i;
            timeout $TIMEOUT time opam exec -- dune exec bin/cvc5 --no-build -- $i;
            if [[ $exit_status -eq 124 ]]; then
              echo "timeout";
            fi;
          done 2>&1 | tee res_cvc5.txt;
          END_TIME=$(date +%s)
          DURATION=$(($END_TIME - $START_TIME))
          echo "Benchmarks with 1 variable completed by CVC5 in: $DURATION seconds with ${{ matrix.flags }}"

      - name: Run OSTRICH2 on StrReLN benchmarks with 1 variable
        run: |
          set +e +o pipefail;
          START_TIME=$(date +%s)
          for i in "./benchmarks/chrobelias/QF_SLIA/2025-generated-strreln/str-reln/benchmark_v1_"*.smt2; do
            timeout $TIMEOUT time opam exec -- dune exec bin/ostrich2 --no-build -- $i;
            if [[ $exit_status -eq 124 ]]; then
              echo "timeout";
            fi;
          done 2>&1 | tee res_ostrich2.txt;
          END_TIME=$(date +%s)
          DURATION=$(($END_TIME - $START_TIME))
          echo "Benchmarks with 1 variable completed by OSTRICH2 in: $DURATION seconds with ${{ matrix.flags }}"

      - name: Run Z3-Noodler on StrReLN benchmarks with 1 variable
        run: |
          set +e +o pipefail;
          START_TIME=$(date +%s)
          for i in "./benchmarks/chrobelias/QF_SLIA/2025-generated-strreln/str-reln/benchmark_v1_"*.smt2; do
            echo $i;
            timeout $TIMEOUT time opam exec -- dune exec bin/z3-noodler --no-build -- $i;
            if [[ $exit_status -eq 124 ]]; then
              echo "timeout";
            fi;
          done 2>&1 | tee res_z3noodler.txt;
          END_TIME=$(date +%s)
          DURATION=$(($END_TIME - $START_TIME))
          echo "Benchmarks with 1 variable completed by Z3-Noodler in: $DURATION seconds with ${{ matrix.flags }}"

      - name: Get stats
        run: |
          echo "Chrobelias results:";
          unsat_c=$(grep unsat res_chro.txt | wc -l); 
          sat_c=$(grep sat res_chro.txt | wc -l); 
          echo "sat     : $((sat_c - unsat_c))"; 
          echo "unsat   : $unsat_c";
          echo "timeout : $(grep timeout res_chro.txt | wc -l)";
          echo "total   : $(grep smt2 res_chro.txt | wc -l)";

          echo "CVC5 results:";
          unsat_c=$(grep unsat res_cvc5.txt | wc -l); 
          sat_c=$(grep sat res_cvc5.txt | wc -l); 
          echo "sat     : $((sat_c - unsat_c))"; 
          echo "unsat   : $unsat_c";
          echo "timeout : $(grep timeout res_cvc5.txt | wc -l)";
          echo "total   : $(grep smt2 res_cvc5.txt | wc -l)";

          echo "OSTRICH2 results:";
          unsat_c=$(grep unsat res_ostrich2.txt | wc -l); 
          sat_c=$(grep sat res_ostrich2.txt | wc -l); 
          echo "sat     : $((sat_c - unsat_c))"; 
          echo "unsat   : $unsat_c";
          echo "timeout : $(grep timeout res_ostrich2.txt | wc -l)";
          echo "total   : $(grep smt2 res_ostrich2.txt | wc -l)";

          echo "Z3-Noodler results:";
          unsat_c=$(grep unsat res_z3noodler.txt | wc -l); 
          sat_c=$(grep sat res_z3noodler.txt | wc -l); 
          echo "sat     : $((sat_c - unsat_c))"; 
          echo "unsat   : $unsat_c";
          echo "timeout : $(grep timeout res_z3noodler.txt | wc -l)";
          echo "total   : $(grep smt2 res_z3noodler.txt | wc -l)";
