name: Build on linux

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

env:
  OPAMROOT: /home/user/.opam

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: we1ine/chrobelias:latest
      options: --user root
    steps:
      - run: opam --version
      - run: opam exec -- ocamlopt --version

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install extra dependencies
        run: sudo apt-get install bc --yes

      # Disabled since the docker image is used.

      #- uses: ocaml/setup-ocaml@v3
      #  with:
      #    ocaml-compiler: 5.3

      #- name: Install Smtml depedencies
      #  working-directory: ./vendor/smtml
      #  run: opam install . --deps-only --with-test --with-dev-setup

      #- name: Install depedencies
      #  run: opam install . --deps-only --with-test

      # The image can lag behind the opam file: install the newer packages,
      # refreshing the package index only when needed. Keep this in sync with
      # Chrobelias.opam. (opam install . fails here: git refuses the checkout.)
      - name: Install dependencies missing from the image
        run: >
          opam install --yes 'smtml>=0.31.0' ||
          (opam update && opam install --yes 'smtml>=0.31.0')

      - name: List opam packages
        run: opam list

      - name: Format
        run: opam exec -- dune fmt

      - name: Build
        run: opam exec -- dune build @check @all

      - name: Tests
        run: opam exec -- dune runtest

