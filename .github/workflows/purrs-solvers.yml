name: Perf different solvers on PURRS

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

env:
  TIMEOUT: 60s
  OPAMROOT: /home/user/.opam

jobs:
  purrs:
    runs-on: self-hosted
    container:
      image: we1ine/chrobelias:latest
      options: --user root --memory=8192m --cpus="1.0"
    strategy:
      fail-fast: false
      matrix:
        solver: ["bin/chro.exe", "bin/swine"]
    steps:
      - run: opam --version
      - run: opam exec -- ocamlopt --version

      - uses: actions/checkout@v4
        with:
          submodules: true

      #- uses: ocaml/setup-ocaml@v3
      #  with:
      #    ocaml-compiler: 5.3
      #    dune-cache: true

      #- name: Install Smtml depedencies
      #  working-directory: ./vendor/smtml
      #  run: opam install . --deps-only --with-test --with-dev-setup

      #- name: Install depedencies
      #  run: opam install . --deps-only --with-test

      - name: List opam packages
        run: opam list

      - name: Build
        run: opam exec -- dune build @all

      - name: Run ${{ matrix.solver }} on purrs benchmarks
        run: |
          ./.github/workflows/run-benchmarks-single.sh "${{ matrix.solver }}" benchmarks/QF_LIA/PURRS $TIMEOUT

      - name: Get stats
        run: |
          ./.github/workflows/stat-benchmarks-single.sh "${{ matrix.solver }}" benchmarks/QF_LIA/PURRS
